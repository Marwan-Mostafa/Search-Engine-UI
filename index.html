<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Search Engine System</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="min-h-screen flex items-center justify-center bg-red-100">

        <div class="w-full max-w-lg px-4 bg-amber-200 flex flex-col items-center justify-between">

            <div class="relative max-w-lg flex items-center justify-start">
                <i class="fa-solid fa-magnifying-glass cursor-pointer text-gray-500 text-sm pointer-events-none absolute z-1 left-2"></i>
                <input type="text" id="searchInput" placeholder="Seach here..."
                class="max-w-lg pl-7 py-1 rounded-full bg-sky-100/70 backdrop-blur-md border border-white/10 text-gray-800 focus:outline-none focus:boder-sky-400 transition
                duration-300 placeholder-gray-500 placeholder:text-sm placeholder:opacity-70">
            </div>

            <div id="loader" class="hidden absolute right-4 top-1/2 -translate-y-1/2">
                <i class="fa-solid fa-circle-notch"></i>
            </div>

            <div id="results" class="mt-4 space-y-2"></div>
            <div id="error" class="hidden mt-4 text-red-400"></div>
        </div>

        <script src="./js/app.js" type="module"></script>
    </body>
</html>
