<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Search Engine System</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="min-h-screen flex items-center justify-center bg-gray-400">

        <div class="w-full max-w-lg px-4 flex flex-col items-center">

            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass text-gray-500 pointer-events-none absolute z-1 top-3.5 left-3"></i>
                
                <input type="text" id="searchInput" placeholder="Seach here..."
                class="w-full pl-10 pr-10 py-2 rounded-full bg-sky-100/70 backdrop-blur-md border border-white/10 text-gray-800 focus:outline-none focus:boder-sky-400 transition
                duration-300 placeholder-gray-500 placeholder:text-sm placeholder:opacity-70">
            </div>

            <div id="results" class="w-full mt-4 max-h-80 overflow-y-auto space-y-3 scroll-smooth"></div>
            <div id="error" class="hidden mt-4 text-red-500"></div>
        </div>

        <script src="./js/app.js" type="module"></script>
    </body>
</html>
