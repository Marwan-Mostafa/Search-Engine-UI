<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/style.css">
        <title>Search Engine System</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="min-h-screen flex items-center justify-center bg-sky-400">
        <div class="w-full max-w-2xl px-4">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Seach here..."
                class="w-full p-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 focus:outline-none focus:boder-sky-400 transition">
            </div>

            <div id="loader" class="hidden absolute right-4 top-1/2 -translate-y-1/2"></div>
            <div id="results" class="mt-4 space-y-2"></div>
            <div id="error" class="hidden mt-4 text-red-400"></div>
        </div>

        <script src="./js/app.js" type="module"></script>
    </body>
</html>
